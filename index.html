<meta charset="utf-8">
<title>Tiny Explorers</title>

<!-- Tablet-first. maximum-scale + user-scalable=no stop iPadOS double-tap zoom and
     pinch-zoom, which toddlers trigger constantly while dragging. viewport-fit=cover
     lets the app paint under the home indicator; the CSS uses safe-area insets. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<meta name="description" content="Cute learning games for 2-5 year olds: counting, shapes, patterns, shadows, tracing, spot the difference and mazes.">

<!-- "Add to Home Screen" on iPad launches fullscreen with no Safari chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiny Explorers">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="styles/main.css">

<div id="app"></div>

<script type="module" src="src/main.js"></script>
